<!DOCTYPE html>
<!-- ▣ qr.html · 학생 화면 QR 띄우기(갤럭시탭용) · v1.0.0 · 2026-11-02
     수정요약: 첫 판 — 제목 «2026 전환기 점심 걷기 챌린지» + 큰 QR. 화면을 누르면 전체화면, 켜 두는 동안 화면이 꺼지지 않게(Wake Lock). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>2026 전환기 점심 걷기 챌린지 · QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gugi&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--blue:#0066cc;--bg:#fff;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,system-ui,sans-serif;}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:20px;box-sizing:border-box;cursor:pointer;-webkit-user-select:none;user-select:none;}
.t{font-family:'Gugi',sans-serif;font-size:clamp(28px,5.6vmin,72px);text-align:center;line-height:1.25;}
.s{font-size:clamp(16px,2.6vmin,30px);color:var(--muted);text-align:center;}
#qr{width:min(60vh,84vw);height:min(60vh,84vw);image-rendering:pixelated;}
.u{font-size:clamp(13px,1.9vmin,22px);color:var(--blue);font-weight:600;word-break:break-all;text-align:center;}
.hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:13px;color:#aaa;transition:opacity .4s;}
.ft{position:fixed;left:0;right:0;bottom:36px;text-align:center;font-size:11px;color:#c7c7cc;line-height:1.5;}
body.fs .hint{opacity:0;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="t">2026 전환기 점심 걷기 챌린지</div>
  <div class="s">휴대폰 카메라로 QR을 찍어 들어오세요</div>
  <img id="qr" alt="학생 화면 QR">
  <div class="u" id="u"></div>
</div>
<div class="ft">QR 띄우기 · v1.0.0 · 배포 2026-11-02 22:00 (KST)<br>ⓒKIMJINHO</div>
<div class="hint" id="hint">화면을 한 번 누르면 전체화면이 됩니다</div>
<script>
(function(){
  // 학생 앱 주소 = 이 파일과 같은 폴더(?url= 로 바꿀 수 있음)
  var q = new URLSearchParams(location.search).get('url');
  var u = q || location.href.replace(/[^\/]*([?#].*)?$/, '');
  document.getElementById('u').textContent = u;
  document.getElementById('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=900x900&margin=10&data=' + encodeURIComponent(u);

  var lock = null;
  function wake(){ try { if (navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(function(l){ lock = l; l.addEventListener('release', function(){ lock = null; }); }).catch(function(){}); } catch (e) {} }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') wake(); });
  wake();

  document.getElementById('wrap').addEventListener('click', function(){
    var d = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    var r = d.requestFullscreen || d.webkitRequestFullscreen;
    if (r) { try { var p = r.call(d); if (p && p.catch) p.catch(function(){}); } catch (e) {} }
    wake();
  });
  function fsChange(){ document.body.classList.toggle('fs', !!(document.fullscreenElement || document.webkitFullscreenElement)); }
  document.addEventListener('fullscreenchange', fsChange); document.addEventListener('webkitfullscreenchange', fsChange);
})();
</script>
</body>
</html>
