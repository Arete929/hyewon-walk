<!DOCTYPE html>
<!-- ▣ dashboard.html · 순위 대시보드(PWA) · v2.46.0 · 2026-08-22
     수정요약: 순위 대시보드 PWA 이전(구글 배너 제거) + 전용 매니페스트 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6A4A">
<link rel="manifest" href="manifest-dashboard.webmanifest">
<link rel="apple-touch-icon" href="icon-180-dashboard.png">
<title>순위 | 아침걷기 챌린지</title>
<style>
  :root{
    --morning:#FBBC04; --lunch:#FF6D01; --main:#34A853; --fail:#EA4335;
    --bg:#F0F2F5; --card:#FFFFFF; --text:#202124; --muted:#5F6368; --radius:16px; --border:#E0E0E0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;}
  .dev-header{background:#0D6E6E;color:#FFC107;text-align:center;padding:12px 10px;line-height:1.4;}
  .dev-header .dev-title{font-size:18px;font-weight:700;}
  .dev-header .dev-info{font-size:12px;font-weight:600;opacity:.9;}

  .top{background:var(--main);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;}
  .top .row1{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .top h1{font-size:17px;font-weight:800;flex:1;}
  .top .refresh{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;}
  .tabs{display:flex;gap:6px;}
  .tabs button{flex:1;padding:9px 4px;border:none;border-radius:10px;font-size:14px;font-weight:700;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;}
  .tabs button.active{background:#fff;color:var(--main);}

  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .stat{background:var(--card);border-radius:var(--radius);padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .stat .v{font-size:22px;font-weight:800;line-height:1.1;} .stat .l{font-size:11px;color:var(--muted);margin-top:4px;}
  @media(max-width:520px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .rank{display:flex;align-items:center;gap:12px;padding:11px;border-radius:12px;margin-bottom:8px;background:#F8F9FA;}
  .rank .medal{font-size:20px;width:34px;text-align:center;font-weight:800;color:var(--muted);}
  .rank.g1{background:linear-gradient(135deg,#FEF3C7,#FDE68A);} .rank.g2{background:linear-gradient(135deg,#E0E7FF,#C7D2FE);} .rank.g3{background:linear-gradient(135deg,#F3E8FF,#E9D5FF);}
  .rank .nm{flex:1;} .rank .nm .n1{font-weight:700;} .rank .nm .n2{font-size:12px;color:var(--muted);}
  .rank .km{font-weight:800;color:var(--main);}
  .spinner-wrap{display:flex;justify-content:center;padding:40px;}
  .spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--main);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .muted{color:var(--muted);} .center{text-align:center;}
  .foot{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 24px;}
</style>
</head>
<body>
<div class="dev-header">
  <div class="dev-title">2026 아침걷기 챌린지</div>
  <div class="dev-info">혜원여중 · 실시간 순위 · <span class="deploy-stamp">PWA</span></div>
</div>

<div class="top">
  <div class="row1">
    <h1 id="title">🏆 순위 대시보드</h1>
    <button class="refresh" onclick="load()">🔄 새로고침</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-g="1" class="active" onclick="selGrade('1')">1학년</button>
    <button data-g="2" onclick="selGrade('2')">2학년</button>
    <button data-g="3" onclick="selGrade('3')">3학년</button>
    <button data-g="all" onclick="selGrade('all')">전체</button>
    <button data-g="teacher" onclick="selGrade('teacher')">교사부</button>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

<script>
/* [PWA] GAS API와 fetch 통신 — google.script.run 인터페이스 유지 */
var API_BASE='https://script.google.com/macros/s/AKfycby_havXeiD6E9PkN3do6WE4wF6OhcM5XotBrPovh85GSrJxHE3jo0R1bx0LBUg1CVeZ/exec';
function apiCall(fn,args,__apiTry){__apiTry=__apiTry||1;return fetch(API_BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,args:args||[]})}).then(function(r){return r.text();}).then(function(txt){var res;try{res=JSON.parse(txt);}catch(e){/* 구글이 JSON 대신 HTML을 준 경우 — 잠깐 쉬고 재시도 */if(__apiTry<3){return new Promise(function(ok){setTimeout(ok,600*__apiTry);}).then(function(){return apiCall(fn,args,__apiTry+1);});}throw new Error('서버 응답을 받지 못했어요. 잠시 후 다시 시도해 주세요.');}return res;});}
function R(){var o={};o.withSuccessHandler=function(f){o._s=f;return o;};o.withFailureHandler=function(f){o._f=f;return o;};['getDashboardData'].forEach(function(k){o[k]=function(){var a=[].slice.call(arguments);apiCall(k,a).then(function(r){o._s&&o._s(r);}).catch(function(e){o._f&&o._f(e);});return o;};});return o;}
window.google={script:{}};Object.defineProperty(window.google.script,'run',{get:R});
</script>
<script>
/* [미리보기 데모] GAS 없을 때만 가짜 데이터로 동작. 운영(GAS)에선 무시됨. */
if (typeof google === 'undefined') { (function(){
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  var M={getDashboardData:function(){var gr={},all=[];[1,2,3].forEach(function(g){var a=[];for(var c=1;c<=5;c++){for(var i=1,n=rnd(18,24);i<=n;i++){var km=Math.random()<0.7?Math.round(rnd(0,400))/10:0;var s={studentNo:''+g+c+(i<10?'0':'')+i,name:'학생'+i,grade:g,classNo:c,totalKm:km,days:km>0?rnd(1,3):0};a.push(s);all.push(s);}}gr[g]=a;});var tch=[{name:'김진호',totalKm:18.2,days:3},{name:'이영희',totalKm:14.1,days:3},{name:'박철수',totalKm:9.0,days:2},{name:'최선영',totalKm:5.5,days:1}];return{challengeName:'2026 아침걷기 챌린지',schoolName:'혜원여중',todayDay:3,maxDay:8,grades:gr,all:all,teachers:tch};}};
  function R(){var o={};o.withSuccessHandler=function(f){o._s=f;return o;};o.withFailureHandler=function(f){o._f=f;return o;};Object.keys(M).forEach(function(k){o[k]=function(){var a=arguments;setTimeout(function(){try{var r=M[k].apply(null,a);o._s&&o._s(r);}catch(e){o._f&&o._f(e);}},300);return o;};});return o;}
  window.google={script:{}};Object.defineProperty(window.google.script,'run',{get:R});
})(); }

var D=null, G='1';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function load(){
  if(typeof google==='undefined'||!google.script){document.getElementById('wrap').innerHTML='<p class="center muted">미리보기 모드 — 실제 앱에서만 데이터가 표시됩니다.</p>';return;}
  google.script.run.withSuccessHandler(function(res){ D=res; if(res&&res.challengeName)document.getElementById('title').textContent='🏆 '+res.challengeName+' 순위'; render(); })
    .withFailureHandler(function(){document.getElementById('wrap').innerHTML='<p class="center muted">데이터 로드 실패</p>';})
    .getDashboardData();
}

function selGrade(g){ G=g; Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('active',b.getAttribute('data-g')===g);}); render(); }

function studentsFor(g){ if(!D)return []; if(g==='all')return D.all||[]; if(g==='teacher')return D.teachers||[]; return (D.grades&&D.grades[g])||[]; }

function render(){
  if(!D){return;}
  var list=studentsFor(G);
  var total=list.length;
  var parts=list.filter(function(s){return s.totalKm>0;});
  var totalKm=list.reduce(function(a,s){return a+(s.totalKm||0);},0);
  var rate=total?Math.round(parts.length/total*100):0;

  var indiv=parts.slice().sort(function(a,b){return b.totalKm-a.totalKm;}).slice(0,10);

  // 학급 순위
  var cls={};
  list.forEach(function(s){ var k=s.grade+'-'+s.classNo; if(!cls[k])cls[k]={name:s.grade+'학년 '+s.classNo+'반',total:0,part:0,km:0}; cls[k].total++; if(s.totalKm>0){cls[k].part++;cls[k].km+=s.totalKm;} });
  var clsArr=Object.keys(cls).map(function(k){return cls[k];}).sort(function(a,b){return b.km-a.km;}).slice(0,8);

  var html=''
    + '<div class="stat-grid">'
    +   stat(total,'전체','var(--main)') + stat(parts.length,'참가','var(--lunch)')
    +   stat((Math.round(totalKm*10)/10),'총 거리(km)','#7c3aed') + stat(rate+'%','참가율','#0288d1')
    + '</div>'
    + (G!=='teacher' ? ('<div class="card"><h2>🏫 학급 순위</h2>'
    + (clsArr.length? clsArr.map(function(c,i){
        var cls=i<2?('rank g'+(i+1)):'rank'; var medal=['🥇','🥈','🥉'][i]||(i+1);
        var rate2=c.total?Math.round(c.part/c.total*100):0;
        return '<div class="'+cls+'"><div class="medal">'+medal+'</div><div class="nm"><div class="n1">'+esc(c.name)+'</div><div class="n2">참가율 '+rate2+'% · '+c.part+'/'+c.total+'명</div></div><div class="km">'+(Math.round(c.km*10)/10)+'km</div></div>';
      }).join('') : '<p class="muted center">데이터 없음</p>')
    + '</div>') : '')
    + '<div class="card"><h2>🏆 개인 순위 TOP 10</h2>'
    + (indiv.length? indiv.map(function(s,i){
        var cls=i<3?('rank g'+(i+1)):'rank'; var medal=['🥇','🥈','🥉'][i]||(i+1);
        var nm=(s.studentNo?esc(s.studentNo)+' ':'')+esc(s.name);
        var sub=(s.grade?(s.grade+'학년 '+s.classNo+'반 · '):'')+s.days+'일 참가';
        return '<div class="'+cls+'"><div class="medal">'+medal+'</div><div class="nm"><div class="n1">'+nm+'</div><div class="n2">'+sub+'</div></div><div class="km">'+(Math.round(s.totalKm*10)/10)+'km</div></div>';
      }).join('') : '<p class="muted center">기록 없음</p>')
    + '</div>'
    + (G==='all'? gradeStats() : '')
    + '<div class="foot">마지막 업데이트: '+new Date().toLocaleString('ko-KR')+(D.todayDay?(' · '+D.todayDay+'일차'):'')+'</div>';

  document.getElementById('wrap').innerHTML=html;
}

function gradeStats(){
  var h='<div class="card"><h2>🎯 학년별</h2><div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">';
  ['1','2','3'].forEach(function(g){
    var l=(D.grades&&D.grades[g])||[]; var p=l.filter(function(s){return s.totalKm>0;}); var km=l.reduce(function(a,s){return a+(s.totalKm||0);},0);
    var rate=l.length?Math.round(p.length/l.length*100):0;
    h+='<div class="stat"><div class="v">'+rate+'%</div><div class="l">'+g+'학년 참가율<br>'+(Math.round(km*10)/10)+'km</div></div>';
  });
  return h+'</div></div>';
}

function stat(v,l,c){ return '<div class="stat"><div class="v" style="color:'+c+'">'+v+'</div><div class="l">'+l+'</div></div>'; }

load();
setInterval(load,60000);
</script>
<script>(function(){var n=document.querySelectorAll('.deploy-stamp');for(var i=0;i<n.length;i++){if(n[i].textContent.indexOf('\x3c?')>=0)n[i].textContent='미리보기';}})();</script>
<script>
(function(){ if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');var rf=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(rf)return;rf=true;location.reload();});} })();
</script>
</body>
</html>
