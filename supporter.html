<!DOCTYPE html>
<!-- ▣ supporter.html · 서포터즈 앱 · v2.61.0 · 2026-08-25
     수정요약: 점심 사용 기기(만보기·디벗·웨어러블) 선택·표시 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>서포터즈 | 아침걷기 챌린지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<meta name="theme-color" content="#FF6A4A">
<link rel="manifest" href="manifest-supporter.webmanifest">
<link rel="apple-touch-icon" href="icon-180-supporter.png">
<style>
  :root{
    --act:linear-gradient(135deg,#FFA94E,#FF5B6B); --hero:linear-gradient(150deg,#FFD27A 0%,#FF9E5E 46%,#FF6B5B 100%);
    --bar:linear-gradient(90deg,#FFC93C,#FF6B5B);
    --coral:#FF6B4A; --focus:#FF8A4C;
    --suc:#1FA978; --suc-bg:#E3F7EE; --warn:#FF6B4A; --warn-bg:#FFEDE2;
    --inp:#FFF1E6; --bg:#FFF7F0; --card:#FFFFFF;
    --t:#4A3530; --m:#a98577; --m2:#c9a594; --m3:#d8b8a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:15px;}
  .app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;}
  .screen{display:none;flex-direction:column;min-height:100vh;}
  .screen.active{display:flex;}

  .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;border:none;border-radius:15px;font-size:17px;font-weight:800;color:#fff;background:var(--act);cursor:pointer;box-shadow:0 10px 18px rgba(255,91,107,.32);transition:transform .12s;}
  .btn:active{transform:scale(.97);} .btn:disabled{opacity:.55;}
  .btn-sm{min-height:42px;font-size:14px;border-radius:13px;}
  .btn-ghost{background:#fff;color:var(--coral);box-shadow:0 5px 14px rgba(232,96,47,.12);}

  .input{width:100%;background:var(--inp);border:2px solid transparent;border-radius:14px;padding:13px 15px;font-size:15px;font-weight:700;color:var(--t);font-family:inherit;}
  .input:focus{outline:none;border-color:var(--focus);background:#fff;}
  .input::placeholder{color:var(--m3);font-weight:500;}

  /* 로그인 */
  .hero{height:236px;background:var(--hero);border-radius:0 0 34px 34px;position:relative;overflow:hidden;padding:24px;display:flex;align-items:center;justify-content:center;}
  .hero .sun{position:absolute;right:22px;top:26px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF2CC,#FFE08A);box-shadow:0 0 34px rgba(255,224,140,.85);}
  .hero .moon{position:absolute;left:-18px;bottom:-22px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18);}
  .hero .dot{position:absolute;border-radius:50%;background:#fff;}
  .hero .ttl{position:relative;color:#fff;}
  .hero .ttl .s{font-size:13px;font-weight:800;opacity:.95;}
  .hero .ttl .b{font-size:33px;font-weight:800;line-height:1.12;margin-top:48px;text-shadow:0 2px 10px rgba(180,60,20,.18);}
  .sup-logo{display:block;margin:0 auto;max-width:206px;max-height:184px;position:relative;z-index:1;filter:drop-shadow(0 8px 18px rgba(180,60,20,.28));}
  .form-card{background:var(--card);margin:-30px 18px 0;border-radius:24px;padding:18px 20px;box-shadow:0 12px 28px rgba(232,96,47,.12);position:relative;}
  .form-card h2{font-size:16px;font-weight:800;color:var(--coral);margin-bottom:14px;}
  .field{margin-bottom:13px;} .field label{display:block;font-size:13px;font-weight:800;color:var(--m);margin-bottom:6px;}
  .pin{letter-spacing:5px;}
  .login-cap{text-align:center;font-size:11px;font-weight:700;color:#cbab9c;margin-top:18px;}
  .err{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:12px;display:none;}
  .err.show{display:block;}

  /* 헤더바 */
  .topbar{background:var(--act);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px;}
  .topbar .l1{font-size:16px;font-weight:800;} .topbar .l2{font-size:11px;font-weight:700;color:#ffe7d6;margin-top:2px;}
  .topbar .day{margin-left:auto;background:rgba(255,255,255,.22);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:800;}

  .body{flex:1;overflow-y:auto;padding:14px 18px 90px;}
  .pick-card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 22px -14px rgba(0,0,0,.15);}
  .pick-card h3{font-size:17px;font-weight:800;color:var(--coral);margin-bottom:14px;}
  .pl{font-size:13px;font-weight:800;color:var(--m);margin:8px 0 7px;}
  .chips{display:flex;gap:8px;}
  .chips.c5{gap:6px;}
  .chip{flex:1;border:none;background:var(--inp);color:var(--m);border-radius:14px;padding:13px 0;font-size:14px;font-weight:800;cursor:pointer;}
  .chip.active{background:var(--act);color:#fff;box-shadow:0 6px 12px rgba(255,91,107,.28);}

  /* 세그먼트 */
  .seg{display:flex;gap:8px;margin-bottom:14px;}
  .seg button{flex:1;border:none;background:#fff;color:var(--m3);border-radius:16px;padding:12px;font-size:13px;font-weight:800;cursor:pointer;}
  .seg button.active{background:var(--act);color:#fff;}

  /* 요약+진행 */
  .sum{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;}
  .pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;}
  .pill-ok{background:var(--suc-bg);color:var(--suc);} .pill-no{background:var(--warn-bg);color:var(--coral);}
  .rate{margin-left:auto;font-size:13px;font-weight:800;color:var(--focus);}
  .track{height:8px;background:#F4E3D6;border-radius:8px;overflow:hidden;margin-bottom:16px;}
  .track>i{display:block;height:100%;background:var(--bar);border-radius:8px;}

  /* 학생 행 */
  .stu{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(120,70,50,.07);overflow:hidden;margin-bottom:9px;}
  .stu-h{display:flex;align-items:center;gap:9px;padding:13px 15px;cursor:pointer;}
  .stu-no{font-size:12px;font-weight:800;color:var(--m2);min-width:38px;}
  .stu-nm{font-size:15px;font-weight:800;}
  .stu-r{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .stu-sum{font-size:12px;font-weight:800;color:#8d6f62;}
  .chev{font-size:11px;font-weight:800;color:var(--m2);}
  .stu-b{padding:0 15px 15px;display:none;animation:pop .32s cubic-bezier(.34,1.56,.64,1);}
  .stu.open .stu-b{display:block;}
  @keyframes pop{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
  .ck-line{display:flex;align-items:center;gap:8px;padding:8px 0 12px;border-bottom:1px dashed #F0E0D4;margin-bottom:12px;}
  .ck-line .lab{font-size:13px;font-weight:700;color:var(--m);}
  .row{display:flex;gap:7px;}
  .row .input{flex:1;}
  .calc{display:flex;gap:6px;margin-top:10px;}
  .calc .c{flex:1;text-align:center;font-size:11px;font-weight:800;border-radius:11px;padding:7px 4px;}
  .c-pace{background:#FFF0EC;color:#FF6B4A;} .c-spd{background:#FFF6E0;color:#E0A413;} .c-cal{background:#E3F7EE;color:#1FA978;}
  .save-row{display:flex;gap:8px;margin-top:12px;}

  /* 점심 카드(항상 펼침) */
  .lcard{background:#fff;border-radius:20px;box-shadow:0 5px 14px rgba(232,96,47,.07);padding:14px 15px;margin-bottom:9px;}
  .lcard-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  
  /* LUNCH-DEVICE v1 — 기기 선택 팔레트 */
  .dvp{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
  .dvp button{flex:1;min-width:74px;border:1.5px solid #F0E0D5;background:#fff;color:#9A8378;border-radius:11px;padding:7px 6px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;line-height:1.25;}
  .dvp button.on{background:linear-gradient(135deg,#FF8A5B,#FF6A6A);color:#fff;border-color:transparent;}
  .dvp button small{display:block;font-size:9.5px;font-weight:700;opacity:.8;}
.l-in{display:flex;gap:6px;}
  .l-in .input{padding:11px 12px;font-size:13px;}
  .in-steps{flex:1.3;color:var(--coral);} .in-p{flex:.8;} .in-note{flex:1;font-weight:500;}

  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #f3e4d8;display:flex;z-index:20;}
  .tabbar button{flex:1;border:none;background:none;padding:13px 0;font-size:14px;font-weight:800;cursor:pointer;color:var(--coral);}
  .tabbar button.muted{color:var(--m);}

  .spin-wrap{display:flex;justify-content:center;padding:40px;}
  .spin{width:38px;height:38px;border-radius:50%;border:4px solid #F4E3D6;border-top-color:var(--coral);animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#4A3530;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:.96;}
  .muted{color:var(--m);} .center{text-align:center;}

/* ── 문의하기 [v2.48] ── */
#s-inq{background:#FFF9F5;}
.iq-nav{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;}
.iq-nav h3{margin:0;font-size:17px;font-weight:800;color:#2B211C;}
.iq-back{border:none;background:none;font-size:22px;line-height:1;color:#2B211C;cursor:pointer;padding:0 4px;}
.iq-seg{display:flex;gap:6px;padding:0 16px 10px;}
.iq-seg button{flex:1;border:1.5px solid #F0E5DC;background:#fff;color:#9A8378;font-size:13.5px;font-weight:800;padding:9px 0;border-radius:10px;cursor:pointer;position:relative;}
.iq-seg button.on{background:#FF6A4A;border-color:#FF6A4A;color:#fff;}
.iq-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E5484D;margin-left:5px;vertical-align:2px;}
.iq-wrap{padding:0 16px 90px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.iq-card{background:#fff;border:1px solid #F0E5DC;border-radius:14px;padding:13px 14px;margin-bottom:10px;}
.iq-lb{font-size:12.5px;font-weight:800;color:#2B211C;margin-bottom:8px;}
.iq-opt{font-weight:600;color:#B7A196;font-size:11.5px;}
.iq-pal{display:flex;flex-wrap:wrap;gap:6px;}
.iq-pal button{border:1.5px solid #F0E5DC;background:#fff;color:#7A655B;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:999px;cursor:pointer;}
.iq-pal button.on{background:#FF6A4A;border-color:#FF6A4A;color:#fff;}
.iq-in,.iq-ta{width:100%;box-sizing:border-box;border:1.5px solid #F0E5DC;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;color:#2B211C;background:#FFFDFC;}
.iq-in:focus,.iq-ta:focus{outline:none;border-color:#FF6A4A;}
.iq-ta{resize:vertical;line-height:1.5;}
.iq-btn{width:100%;border:none;border-radius:12px;padding:13px 0;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;}
.iq-cta{background:#FF6A4A;color:#fff;box-shadow:0 6px 16px rgba(255,106,74,.28);}
.iq-cta:disabled{opacity:.55;box-shadow:none;}
.iq-ghost{background:#fff;border:1.5px solid #F0E5DC;color:#7A655B;}
.iq-prev{margin-top:9px;}
.iq-prev img{width:100%;border-radius:10px;display:block;}
.iq-prev .rm{margin-top:6px;font-size:12px;font-weight:700;color:#E5484D;background:none;border:none;cursor:pointer;padding:0;}
.iq-err{display:none;color:#E5484D;font-size:13px;font-weight:700;margin:2px 0 8px;text-align:center;}
.iq-err.on{display:block;}
.iq-saved{text-align:center;font-size:12px;font-weight:700;color:#6FA96B;margin-top:8px;min-height:16px;}
.iq-item{background:#fff;border:1px solid #F0E5DC;border-radius:14px;padding:13px 14px;margin-bottom:10px;}
.iq-it-h{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.iq-tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#FFF0EB;color:#FF6A4A;}
.iq-st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;}
.iq-st.s0{background:#FFF3E2;color:#B5740A;}
.iq-st.s1{background:#E9F1FF;color:#2F6FD0;}
.iq-st.s2{background:#E8F6E9;color:#3E8E43;}
.iq-when{font-size:11px;color:#B7A196;font-weight:700;margin-left:auto;}
.iq-msg{font-size:13.5px;color:#2B211C;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.iq-ph{margin-top:8px;font-size:12px;font-weight:800;color:#FF6A4A;background:none;border:none;padding:0;cursor:pointer;}
.iq-rep{margin-top:10px;padding:10px 12px;background:#F6FBF6;border:1px solid #DCEEDC;border-radius:10px;}
.iq-rep .h{font-size:11.5px;font-weight:800;color:#3E8E43;margin-bottom:4px;}
.iq-rep .b{font-size:13.5px;color:#2B211C;line-height:1.55;white-space:pre-wrap;}
.iq-empty{text-align:center;color:#B7A196;font-size:13px;padding:40px 0;}
.iq-fab{position:fixed;right:12px;bottom:78px;z-index:45;border:none;border-radius:999px;padding:11px 16px 11px 13px;
  background:#FF6A4A;color:#fff;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;
  box-shadow:0 8px 20px rgba(255,106,74,.4);display:none;align-items:center;gap:6px;white-space:nowrap;}
.iq-fab .ic{font-size:17px;line-height:1;}
.iq-fab .nd{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#E5484D;border:2px solid #fff;display:none;}
.iq-note{background:#EAF4FF;border:1px solid #CFE4FB;border-radius:12px;padding:12px 14px;margin-bottom:10px;
  font-size:12.5px;line-height:1.75;color:#33567F;}
.iq-note b{display:block;color:#1E5FB0;font-size:13px;margin-bottom:5px;}
.iq-note .step{display:block;}
.iq-shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px;}
.iq-shot{position:relative;border-radius:10px;overflow:hidden;background:#F3EDE9;aspect-ratio:1;}
.iq-shot img{width:100%;height:100%;object-fit:cover;display:block;}
.iq-shot .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0;}
.iq-shot .nn{position:absolute;left:4px;bottom:3px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;
  font-weight:800;border-radius:5px;padding:1px 5px;}
.iq-lbox{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:120;display:flex;align-items:center;justify-content:center;padding:18px;}
.iq-lbox img{max-width:100%;max-height:86vh;border-radius:10px;}
.iq-lbox .x{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.16);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;}
.iq-lbox .ld{color:#fff;font-size:14px;font-weight:700;}

</style>
</head>

<script>
/* [미리보기 데모] GAS 없을 때만 가짜 데이터로 동작. 운영(GAS)에선 무시됨. */
/* [PWA] GAS API와 fetch 통신 — google.script.run 인터페이스 유지 (서포터) */
var API_BASE='https://script.google.com/macros/s/AKfycby_havXeiD6E9PkN3do6WE4wF6OhcM5XotBrPovh85GSrJxHE3jo0R1bx0LBUg1CVeZ/exec';
function apiCall(fn,args,__apiTry){__apiTry=__apiTry||1;return fetch(API_BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,token:localStorage.getItem('achim_sup_token')||'',args:args||[]})}).then(function(r){return r.text();}).then(function(txt){var res;try{res=JSON.parse(txt);}catch(e){/* 구글이 JSON 대신 HTML을 준 경우 — 잠깐 쉬고 재시도 */if(__apiTry<3){return new Promise(function(ok){setTimeout(ok,600*__apiTry);}).then(function(){return apiCall(fn,args,__apiTry+1);});}throw new Error('서버 응답을 받지 못했어요. 잠시 후 다시 시도해 주세요.');}if(res&&res.token)localStorage.setItem('achim_sup_token',res.token);return res;});}
function R(){var o={};o.withSuccessHandler=function(f){o._s=f;return o;};o.withFailureHandler=function(f){o._f=f;return o;};['supporterLogin','getCheckinQrUrl','getClassRoster','supporterProxyCheckIn','submitMorningRun','submitLunchSteps','lookupStudentName','getMyRoster','submitInquiry','getMyInquiries','getInquiryPhoto'].forEach(function(k){o[k]=function(){var a=[].slice.call(arguments);apiCall(k,a).then(function(r){o._s&&o._s(r);}).catch(function(e){o._f&&o._f(e);});return o;};});return o;}
window.google={script:{}};Object.defineProperty(window.google.script,'run',{get:R});

function showMyRoster(){
  showScreen('roster');
  var b=document.getElementById('roster-body');
  b.innerHTML='<div style="text-align:center;color:var(--m);padding:34px;">불러오는 중…</div>';
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ b.innerHTML='<div style="text-align:center;color:var(--warn);padding:34px;">근무표를 불러오지 못했어요.</div>'; return; }
    if(!r.shifts||!r.shifts.length){ b.innerHTML='<div style="text-align:center;color:var(--m);padding:44px 20px;"><div style="font-size:46px;">🗓️</div><div style="margin-top:12px;font-weight:800;">아직 배정된 근무가 없어요.</div><div style="font-size:13px;margin-top:6px;color:var(--m2);">선생님이 근무표를 정하면 여기에 표시돼요.</div></div>'; return; }
    var byDate={};
    r.shifts.forEach(function(s){ (byDate[s.md]=byDate[s.md]||[]).push(s.slot); });
    var html='<div style="font-size:13px;color:var(--m);font-weight:800;margin-bottom:12px;">총 '+r.shifts.length+'회 근무예요! 💪</div>';
    html+=Object.keys(byDate).map(function(md){
      var slots=byDate[md].map(function(sl){ var am=sl==='아침'; return '<span style="display:inline-block;background:'+(am?'linear-gradient(135deg,#FFC93C,#FF9E3D)':'linear-gradient(135deg,#7FB4FF,#5B8DEF)')+';color:#fff;border-radius:999px;padding:4px 13px;font-size:12px;font-weight:800;margin-right:6px;">'+(am?'🌅 아침':'🌞 점심')+'</span>'; }).join('');
      return '<div style="background:#fff;border-radius:15px;padding:13px 15px;margin-bottom:9px;box-shadow:0 8px 20px -14px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;"><div style="font-weight:800;font-size:15px;min-width:78px;">'+esc(md)+'</div><div>'+slots+'</div></div>';
    }).join('');
    b.innerHTML=html;
  }).withFailureHandler(function(){ b.innerHTML='<div style="text-align:center;color:var(--warn);padding:34px;">오류가 발생했어요. 다시 시도해 주세요.</div>'; }).getMyRoster();
}

var S={ sup:null, grade:3, classNo:2, mode:'morning', students:[], day:0, openNo:null };
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1900);}
function showErr(el,m){el.textContent=m;el.classList.add('show');}
function fmtSec(s){s=Number(s)||0;var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
function deriveRun(km,dur){km=parseFloat(km);if(!isFinite(km)||km<=0)return null;var s=String(dur||'').trim(),tot=0;if(s.indexOf(':')>=0){var p=s.split(':');tot=(parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}else if(s!=='')tot=Math.round((parseFloat(s)||0)*60);if(tot<=0)return{km:km,pace:null,speed:null,cal:Math.round(km*62)};var ps=tot/km,pm=Math.floor(ps/60),pp=Math.round(ps%60);return{km:km,pace:pm+"'"+(pp<10?'0':'')+pp+'"',speed:Math.round(km/(tot/3600)*10)/10,cal:Math.round(km*62)};}

/* 로그인 */
function doLogin(){
  var no=$('inp-no').value.trim(),name=$('inp-name').value.trim(),pin=$('inp-pin').value.trim(),e=$('lg-err');e.classList.remove('show');

  var b=$('btn-login');b.disabled=true;b.textContent='확인 중…';
  google.script.run.withSuccessHandler(function(r){b.disabled=false;b.textContent='로그인 →';

/* 실시간 체크인 QR (몇 초마다 갱신 + 게이지) */
var qrActive=false, qrTimer=null;
function showCheckinQr(){
  if(!S.sup){showScreen('login');return;}
  stopQr(); qrActive=true; showScreen('qr');
  $('qr-body').innerHTML='<div class="pick-card" style="margin-top:14px;"><div class="spin-wrap"><div class="spin"></div></div></div>';
  refreshQr();
}
function stopQr(){ qrActive=false; if(qrTimer){clearTimeout(qrTimer);qrTimer=null;} }
function refreshQr(){
  if(!qrActive)return;
  google.script.run.withSuccessHandler(function(res){
    if(!qrActive)return;
    var url=(res&&res.url)?res.url:res; var sec=(res&&res.refreshSec)?res.refreshSec:15;
    var img='https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=12&data='+encodeURIComponent(url);
    $('qr-body').innerHTML=
      '<div class="pick-card" style="margin-top:14px;">'+
      '<img src="'+img+'" alt="QR" style="width:100%;max-width:330px;border-radius:14px;display:block;margin:0 auto;">'+
      '<div style="height:10px;background:#F4E3D6;border-radius:8px;overflow:hidden;margin:14px 4px 8px;"><div id="qrGauge" style="height:100%;background:var(--bar);border-radius:8px;width:100%;"></div></div>'+
      '<div style="font-weight:800;color:var(--coral);font-size:15px;">🔄 '+sec+'초마다 새 QR로 바뀝니다</div>'+
      '<div class="muted" style="font-size:13px;margin-top:6px;line-height:1.6;">학생이 <b>지금 바로</b> 스캔하면 출석 체크인.<br>몇 초 지난(스크린샷) QR은 무효예요.</div>'+
      '</div>';
    var g=$('qrGauge');
    if(g){ g.style.transition='none'; g.style.width='100%'; void g.offsetWidth; g.style.transition='width '+sec+'s linear'; g.style.width='0%'; }
    qrTimer=setTimeout(refreshQr, sec*1000);
  }).withFailureHandler(function(){ if(qrActive){ qrTimer=setTimeout(refreshQr,3000); } }).getCheckinQrUrl();
}

/* 학년·반 선택 */
function renderPicker(){
  $('cls-title').textContent='학급 선택';
  $('day-badge').textContent='DAY -';
  $('main-body').innerHTML=
    '<div class="pick-card"><h3>학년 · 반 선택 <img src="https://arete929.github.io/hyewon-walk/icons/class.png" style="width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:3px"></h3>'+
    '<div class="pl">학년</div><div class="chips" id="pg"></div>'+
    '<div class="pl">반</div><div class="chips c5" id="pc"></div>'+
    '<button class="btn" style="margin-top:16px;" onclick="loadClass()">조회하기</button></div>';
  var pg=$('pg');[1,2,3].forEach(function(g){pg.appendChild(chip(g+'학년',S.grade===g,function(b){S.grade=g;act(pg,b);}));});
  var pc=$('pc');[1,2,3,4,5].forEach(function(c){pc.appendChild(chip(c+'반',S.classNo===c,function(b){S.classNo=c;act(pc,b);}));});

function chip(label,on,fn){var b=document.createElement('button');b.className='chip'+(on?' active':'');b.textContent=label;b.onclick=function(){fn(b);};return b;}
function act(p,b){Array.prototype.forEach.call(p.children,function(x){x.classList.remove('active');});b.classList.add('active');}

/* 명단 조회 */
function loadClass(){
  if(!S.sup){showScreen('login');return;}
  $('cls-title').textContent=S.grade+'학년 '+S.classNo+'반';
  $('main-body').innerHTML='<div class="spin-wrap"><div class="spin"></div></div>';
  google.script.run.withSuccessHandler(function(r){
    if(!r.ok){$('main-body').innerHTML='<p class="center muted" style="padding:30px;">'+esc(r.reason||'불러오기 실패')+'</p>';return;}
    S.students=r.students||[];S.day=r.day||0;S.openNo=null;
    $('day-badge').textContent='DAY '+(S.day||'-');
    renderList();
  }).withFailureHandler(function(){$('main-body').innerHTML='<p class="center muted" style="padding:30px;">불러오기 오류</p>';}).getClassRoster(S.grade,S.classNo);
}

function setMode(m){S.mode=m;S.openNo=null;renderList();}

function renderList(){
  var doneFn=S.mode==='morning'?function(s){return s.morningRunEntered;}:function(s){return s.lunchSteps;};
  var done=S.students.filter(doneFn).length, total=S.students.length, rate=total?Math.round(done/total*100):0;
  var lab=S.mode==='morning'?['인증','미인증']:['입력','미입력'];
  var head=
    '<div class="seg"><button class="'+(S.mode==='morning'?'active':'')+'" onclick="setMode(\'morning\')"><img src="https://arete929.github.io/hyewon-walk/icons/run.png" style="width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:3px">아침 러닝</button>'+
    '<button class="'+(S.mode==='lunch'?'active':'')+'" onclick="setMode(\'lunch\')"><img src="https://arete929.github.io/hyewon-walk/icons/walk.png" style="width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:3px">점심</button></div>'+
    '<div class="sum"><span class="pill pill-ok">'+lab[0]+' '+done+'</span><span class="pill pill-no">'+lab[1]+' '+(total-done)+'</span><span class="rate">'+rate+'%</span></div>'+
    '<div class="track"><i style="width:'+rate+'%"></i></div>';
  var list = total===0 ? '<p class="center muted" style="padding:20px;">명단이 없습니다.</p>'
    : (S.mode==='morning'? S.students.map(morningRow).join('') : S.students.map(lunchCard).join(''))
    + (S.mode==='lunch'&&S.day? '<button class="btn" style="margin-top:8px;" onclick="submitLunch()">점심 기록 제출</button>':'');
  $('main-body').innerHTML=head+list;
}

/* 아침 러닝 행(아코디언) */
function morningRow(s){
  var open=S.openNo===s.studentNo;
  var right = s.morningRunEntered
    ? '<span class="stu-sum">'+(s.morningKm!=null?s.morningKm+'㎞':'')+'</span><span class="pill pill-ok">인증 ✓</span>'
    : '<span class="pill pill-no">미인증</span>';
  var ck = s.morningChecked
    ? '<span class="lab"><img src="https://arete929.github.io/hyewon-walk/icons/check.png" style="width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:3px">체크인 '+esc(s.morningTime||'')+'</span>'
    : '<span class="lab">미체크인</span><button class="btn btn-sm btn-ghost" style="width:auto;padding:0 14px;margin-left:auto;" onclick="proxyCk(\''+esc(s.studentNo)+'\',event)">대리 체크인</button>';
  var d=deriveRun(s.morningKm,s.morningSec?fmtSec(s.morningSec):'');
  return '<div class="stu'+(open?' open':'')+'" data-no="'+esc(s.studentNo)+'">'+
    '<div class="stu-h" onclick="toggle(\''+esc(s.studentNo)+'\')"><span class="stu-no">'+esc(s.studentNo)+'</span><span class="stu-nm">'+esc(s.name)+'</span>'+
      '<span class="stu-r">'+right+'<span class="chev">'+(open?'▲':'▼')+'</span></span></div>'+
    '<div class="stu-b">'+
      '<div class="ck-line">'+ck+'</div>'+
      '<div class="row"><input class="input mr-km" type="number" step="0.01" inputmode="decimal" placeholder="거리 (㎞)" value="'+(s.morningKm!=null?s.morningKm:'')+'" oninput="calc(\''+esc(s.studentNo)+'\')"><input class="input mr-dur" type="text" inputmode="numeric" placeholder="시간 31:47" value="'+(s.morningSec?fmtSec(s.morningSec):'')+'" oninput="calc(\''+esc(s.studentNo)+'\')"></div>'+
      '<div class="calc" id="calc-'+esc(s.studentNo)+'" style="'+(d&&d.pace?'':'display:none;')+'">'+calcHtml(d)+'</div>'+
      '<div class="save-row"><button class="btn btn-sm" onclick="saveRun(\''+esc(s.studentNo)+'\',event)">러닝 저장</button></div>'+
    '</div></div>';
}
function calcHtml(d){ if(!d)return''; return '<div class="c c-pace"><img src="https://arete929.github.io/hyewon-walk/icons/pace.png" style="width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:2px">'+(d.pace||'-')+'</div><div class="c c-spd"><img src="https://arete929.github.io/hyewon-walk/icons/speed.png" style="width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:2px">'+(d.speed!=null?d.speed:'-')+'㎞/h</div><div class="c c-cal"><img src="https://arete929.github.io/hyewon-walk/icons/cal.png" style="width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:2px">'+(d.cal!=null?d.cal:'-')+'㎉</div>'; }
function calc(no){
  var row=document.querySelector('.stu[data-no="'+no+'"]'); if(!row)return;
  var km=row.querySelector('.mr-km').value, dur=row.querySelector('.mr-dur').value;
  var d=deriveRun(km,dur); var box=$('calc-'+no);
  if(d&&d.pace){box.innerHTML=calcHtml(d);box.style.display='flex';} else box.style.display='none';
}
function toggle(no){S.openNo=(S.openNo===no?null:no);renderList();}

function proxyCk(no,ev){ if(ev)ev.stopPropagation();
  // [v2.49] 브라우저 prompt 대신 앱 모달 — GAS iframe 주소 제목이 안 붙는다
  uiPrompt('대리 체크인 사유를 반드시 입력하세요.\n(예: 스마트폰 미소지 / 배터리 방전 / 앱 오류 등)', function(v){
    var reason=(v||'').trim();
    if(!reason){ toast('사유를 입력해야 대리 체크인이 됩니다.'); return; }
    doProxyCk(no, reason);
  }, {placeholder:'예) 스마트폰 미소지', okText:'체크인'});
}
function doProxyCk(no, reason){
  google.script.run.withSuccessHandler(function(r){
    var s=S.students.filter(function(x){return x.studentNo===no;})[0];
    if(r.ok){if(s){s.morningChecked=true;s.morningTime=r.time;}toast('체크인 완료');renderList();}
    else {if(r.already&&s){s.morningChecked=true;} toast(r.reason||'실패');renderList();}
  }).withFailureHandler(function(){toast('오류가 발생했습니다.');}).supporterProxyCheckIn(no,{studentNo:S.sup.studentNo,name:S.sup.name},reason);
}

function saveRun(no,ev){ if(ev)ev.stopPropagation();
  var row=document.querySelector('.stu[data-no="'+no+'"]');
  var km=row.querySelector('.mr-km').value.trim(), dur=row.querySelector('.mr-dur').value.trim();
  if(!km){toast('거리를 입력하세요.');return;}
  var btn=row.querySelector('.save-row .btn'); btn.disabled=true; btn.textContent='저장 중…';
  google.script.run.withSuccessHandler(function(r){btn.disabled=false;btn.textContent='러닝 저장';
    if(r.ok){var s=S.students.filter(function(x){return x.studentNo===no;})[0];if(s){s.morningKm=r.km;s.morningRunEntered=true;var sec=0;if(dur.indexOf(':')>=0){var pp=dur.split(':');sec=(parseInt(pp[0],10)||0)*60+(parseInt(pp[1],10)||0);}else if(dur)sec=Math.round((parseFloat(dur)||0)*60);s.morningSec=sec||null;}toast('러닝 저장 완료 ('+r.km+'㎞)');S.openNo=null;renderList();}
    else toast(r.reason||'저장 실패');
  }).withFailureHandler(function(){btn.disabled=false;btn.textContent='러닝 저장';toast('저장 오류');}).submitMorningRun(no,km,dur,{studentNo:S.sup.studentNo,name:S.sup.name});
}


/* LUNCH-DEVICE v1 — 기기 선택 (만보기·디벗·웨어러블) */
var DEVICES = [['만보기',''],['디벗','태블릿'],['웨어러블','워치·밴드']];
function devPalette(cur){
  cur = cur || '만보기';
  return '<div class="dvp">' + DEVICES.map(function(d){
    return '<button type="button" class="'+(cur===d[0]?'on':'')+'" data-dv="'+d[0]+'" onclick="pickDevice(this)">'
      + d[0] + (d[1] ? '<small>'+d[1]+'</small>' : '') + '</button>';
  }).join('') + '</div>';
}
function pickDevice(btn){
  var wrap = btn.parentNode;
  wrap.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
}
function deviceOf(card){
  var on = card.querySelector('.dvp button.on');
  return on ? on.getAttribute('data-dv') : '만보기';
}

/* 점심 카드 */
function lunchCard(s){
  var has=s.lunchSteps?true:false;
  return '<div class="lcard" data-no="'+esc(s.studentNo)+'"><div class="lcard-h"><span class="stu-no">'+esc(s.studentNo)+'</span><span class="stu-nm" style="font-size:14px;">'+esc(s.name)+'</span>'+
    '<span class="stu-r">'+(has?'<span class="pill pill-ok">입력됨 ✓</span>':'<span class="pill pill-no">미입력</span>')+'</span></div>'+
    devPalette(s.lunchDevice)+'<div class="l-in"><input class="input in-steps" type="number" inputmode="numeric" placeholder="걸음수" value="'+(s.lunchSteps||'')+'"><input class="input in-p" type="text" placeholder="P-" value="'+esc(s.pedometerId||'')+'"><input class="input in-note" type="text" placeholder="비고" value="'+esc(s.note||'')+'"></div></div>';
}
function submitLunch(){
  if(!S.day){toast('챌린지 기간이 아닙니다.');return;}
  var entries=[];
  document.querySelectorAll('#main-body .lcard').forEach(function(c){
    var st=c.querySelector('.in-steps').value.trim(); if(st==='')return;
    entries.push({studentNo:c.getAttribute('data-no'),steps:st,device:deviceOf(c),pedometerId:c.querySelector('.in-p').value.trim(),note:c.querySelector('.in-note').value.trim()});
  });
  if(!entries.length){toast('입력된 걸음수가 없습니다.');return;}
  google.script.run.withSuccessHandler(function(r){
    if(!r.ok){toast(r.reason||'제출 실패');return;}
    var ok=r.results.filter(function(x){return x.status==='ok';}).length;
    var warn=r.results.filter(function(x){return x.status==='warn';}).length;
    var err=r.results.filter(function(x){return x.status==='error';}).length;
    toast('제출 완료 · 성공 '+ok+(warn?' / 주의 '+warn:'')+(err?' / 오류 '+err:''));
    loadClass();
  }).withFailureHandler(function(){toast('제출 오류');}).submitLunchSteps(entries,{studentNo:S.sup.studentNo,name:S.sup.name});
}

<script>
/* [공통 v1.0] 홈 화면 바로가기(설치) 버튼 — 로그인 화면에서만 노출 */
(function(){
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(standalone) return;
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var deferred=null, btn=null, installed=false;

  function onLogin(){ var el=document.getElementById('s-login'); return !!(el&&el.classList.contains('active')); }

  function build(){
    if(btn) return;
    btn=document.createElement('button');
    btn.type='button';
    btn.textContent='\uD83D\uDCF2 홈 화면에 바로가기 추가';
    btn.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:99998;max-width:92vw;padding:12px 20px;border:none;border-radius:999px;font-family:inherit;font-size:13.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FF8A5B,#FF6A6A);box-shadow:0 10px 26px -8px rgba(255,106,106,.75);cursor:pointer;display:none;';
    btn.onclick=click;
    document.body.appendChild(btn);
  }
  function sync(){
    if(installed) return;
    if(!deferred && !isIOS) return;      // 설치 불가 브라우저면 아예 안 보임
    build();
    btn.style.display = onLogin() ? 'block' : 'none';
  }
  function click(){
    if(deferred){
      deferred.prompt();
      deferred.userChoice.then(function(c){ if(c&&c.outcome==='accepted'){installed=true;if(btn)btn.style.display='none';} });
      deferred=null; return;
    }
    guide();
  }
  function guide(){
    var msg = isIOS
      ? '화면 아래 <b>공유 버튼</b>을 누른 뒤<br><b>&ldquo;홈 화면에 추가&rdquo;</b>를 선택하세요.'
      : '브라우저 <b>메뉴(&#8942;)</b> &rarr; <b>&ldquo;홈 화면에 추가&rdquo;</b><br>또는 <b>&ldquo;앱 설치&rdquo;</b>를 선택하세요.';
    var o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:22px;';
    o.innerHTML='<div style="background:#fff;border-radius:20px;padding:22px 20px;max-width:330px;width:100%;text-align:center;font-family:inherit;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);">'
      +'<div style="font-size:16px;font-weight:800;color:#2D2A28;margin-bottom:10px;">홈 화면에 바로가기 추가</div>'
      +'<div style="font-size:13.5px;line-height:1.8;color:#6B5C53;">'+msg+'</div>'
      +'<button type="button" style="margin-top:16px;width:100%;min-height:46px;border:none;border-radius:13px;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FF8A5B,#FF6A6A);cursor:pointer;">확인</button></div>';
    o.querySelector('button').onclick=function(){o.remove();};
    o.onclick=function(e){ if(e.target===o) o.remove(); };
    document.body.appendChild(o);
  }

  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; sync(); });
  window.addEventListener('appinstalled',function(){ installed=true; if(btn)btn.style.display='none'; });
  if(isIOS) setTimeout(sync,1000);
  setInterval(sync,700);   // 로그인/로그아웃 화면 전환 추적
})();
</script>

        <div class="iq-card">
          <div class="iq-lb">관련 일차 <span class="iq-opt">(선택)</span></div>
          <input id="iq-day" class="iq-in" type="number" min="1" max="14" placeholder="예: 3  ← 3일차 기록 문제라면">
        </div>
        <div class="iq-card">
          <div class="iq-lb">문의 내용</div>
          <textarea id="iq-msg" class="iq-ta" rows="5" placeholder="어떤 점이 문제인지 적어 주세요.&#10;예) 8월 25일에 1.2km 걸었는데 기록이 0으로 나와요."></textarea>
        </div>
        <div class="iq-note">
          <b>📸 사진은 이렇게 올려 주세요</b>
          <span class="step">① <b style="display:inline;">안 되는 화면</b>을 그대로 캡처해 주세요 (빨간 실패 메시지가 보이게)</span>
          <span class="step">② <b style="display:inline;">운동 앱 기록 화면</b>도 같이 올려 주세요 (거리·시간이 보이는 화면)</span>
          두 장을 함께 보내주면 선생님이 <b style="display:inline;">기록을 바로 넣어줄 수 있어요.</b>
        </div>
        <div class="iq-card">
          <div class="iq-lb">사진 첨부 <span class="iq-opt">(최대 5장)</span></div>
          <input type="file" id="iq-file" accept="image/*" multiple style="display:none;" onchange="inqPickFile(this)">
          <button type="button" class="iq-btn iq-ghost" onclick="document.getElementById('iq-file').click()">📷 사진 고르기 (여러 장 선택 가능)</button>
          <div class="iq-shots" id="iq-shots"></div>
          <div class="iq-prev" id="iq-prev"></div>
        </div>
        <div class="iq-err" id="iq-err"></div>
        <button type="button" class="iq-btn iq-cta" id="iq-send" onclick="inqSubmit()">문의 보내기</button>
        <div class="iq-saved" id="iq-saved"></div>
      </div>
      <div id="iq-list" style="display:none;"></div>
    </div>
  </div>
  <button type="button" class="iq-fab" id="iq-fab" onclick="inqOpen()" title="체육쌤께 문의하기"><span class="ic">💬</span>체육쌤께 문의하기<span class="nd" id="iq-fab-dot"></span></button>

<script>

/* ═══ 문의하기 (INQUIRY v1) [v2.48] ═══ */
var INQ = { role: '서포터즈', type: '기록이 안 맞아요', shots: [], list: null, tab: 'new', loaded: false };
var INQ_TYPES = ['기록이 안 맞아요', '사진 인식이 실패해요', '앱이 안 돼요', '기타'];

function inqWho(){ try { return { no: (S.sup && S.sup.studentNo) || '', name: (S.sup && S.sup.name) || '' }; } catch(e){ return { no:'', name:'' }; } }
function inqReady(){ var w = inqWho(); return !!(w.no || w.name); }

function inqFab(){
  var f = document.getElementById('iq-fab'); if (!f) return;
  var login = document.getElementById('s-login');
  var inq = document.getElementById('s-inq');
  var hide = (login && login.classList.contains('active')) || (inq && inq.classList.contains('active')) || !inqReady();
  f.style.display = hide ? 'none' : 'flex';
  if (!hide && !INQ.loaded) inqLoad(true);
}

function inqBack(){ showScreen('main'); setTimeout(inqFab, 0); }

function inqOpen(){
  if (!inqReady()) { alert('먼저 로그인해 주세요.'); return; }
  // 분석 결과 화면에서 눌렀다면 '기록이 안 맞아요' 로 미리 골라 준다
  var rs = document.getElementById('s-result');
  if (rs && rs.classList.contains('active')) INQ.type = '기록이 안 맞아요';
  showScreen('inq');
  inqRenderTypes();
  inqRenderShots();
  inqTab('new');
  inqLoad();
  setTimeout(inqFab, 0);
}

function inqTab(t){
  INQ.tab = t;
  document.getElementById('iq-t-new').classList.toggle('on', t === 'new');
  document.getElementById('iq-t-list').classList.toggle('on', t === 'list');
  document.getElementById('iq-new').style.display = (t === 'new') ? '' : 'none';
  document.getElementById('iq-list').style.display = (t === 'list') ? '' : 'none';
  if (t === 'list') inqRenderList();
}

function inqRenderTypes(){
  var el = document.getElementById('iq-types'); if (!el) return;
  el.innerHTML = INQ_TYPES.map(function(t){
    return '<button type="button" class="' + (INQ.type === t ? 'on' : '') + '" onclick="inqPickType(\'' + t + '\')">' + t + '</button>';
  }).join('');
}
function inqPickType(t){ INQ.type = t; inqRenderTypes(); }

function inqShrink(file, cb){
  try {
    var rd = new FileReader();
    rd.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        try {
          var MAX = 1400, w = img.width, h = img.height;
          var s = Math.min(1, MAX / Math.max(w, h));
          if (s >= 1 && file.size <= 900 * 1024) { cb(ev.target.result.split(',')[1], file.type, ev.target.result); return; }
          var cw = Math.round(w * s), ch = Math.round(h * s);
          var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
          var cx = cv.getContext('2d');
          cx.fillStyle = '#fff'; cx.fillRect(0, 0, cw, ch);
          cx.drawImage(img, 0, 0, cw, ch);
          var du = cv.toDataURL('image/jpeg', 0.82);
          cb(du.split(',')[1], 'image/jpeg', du);
        } catch(e){ cb(ev.target.result.split(',')[1], file.type, ev.target.result); }
      };
      img.onerror = function(){ cb(ev.target.result.split(',')[1], file.type, ev.target.result); };
      img.src = ev.target.result;
    };
    rd.readAsDataURL(file);
  } catch(e){ cb('', '', ''); }
}

/* [v2.61] 사진 여러 장 */
function inqPickFile(inp){
  var fl = inp.files; if (!fl || !fl.length) return;
  var room = 5 - INQ.shots.length;
  if (room <= 0) { document.getElementById('iq-prev').innerHTML = '<div class="iq-opt">사진은 5장까지예요.</div>'; inp.value = ''; return; }
  var list = [].slice.call(fl, 0, room);
  var pv = document.getElementById('iq-prev');
  pv.innerHTML = '<div class="iq-opt">사진 준비 중…</div>';
  var left = list.length;
  list.forEach(function(f){
    inqShrink(f, function(b64, mime, dataUrl){
      if (b64) INQ.shots.push({ base64: b64, mime: mime || 'image/jpeg', url: dataUrl });
      if (--left === 0) { pv.innerHTML = ''; inqRenderShots(); }
    });
  });
  inp.value = '';
}
function inqRenderShots(){
  var el = document.getElementById('iq-shots'); if (!el) return;
  el.innerHTML = INQ.shots.map(function(s, i){
    return '<div class="iq-shot"><img src="' + s.url + '" alt="첨부 ' + (i+1) + '">' +
           '<span class="nn">' + (i+1) + '</span>' +
           '<button type="button" class="rm" title="빼기" onclick="inqDropShot(' + i + ')">✕</button></div>';
  }).join('');
}
function inqDropShot(i){ INQ.shots.splice(i, 1); inqRenderShots(); }
function inqClearFile(){
  INQ.shots = [];
  var f = document.getElementById('iq-file'); if (f) f.value = '';
  var pv = document.getElementById('iq-prev'); if (pv) pv.innerHTML = '';
  inqRenderShots();
}

function inqSubmit(){
  var err = document.getElementById('iq-err'); err.classList.remove('on');
  var msg = document.getElementById('iq-msg').value.trim();
  if (!msg) { err.textContent = '문의 내용을 적어 주세요.'; err.classList.add('on'); return; }
  var w = inqWho();
  var b = document.getElementById('iq-send'); b.disabled = true; b.textContent = '보내는 중…';
  google.script.run.withSuccessHandler(function(r){
    b.disabled = false; b.textContent = '문의 보내기';
    if (r && r.ok) {
      document.getElementById('iq-msg').value = '';
      document.getElementById('iq-day').value = '';
      inqClearFile();
      document.getElementById('iq-saved').textContent = '✅ 보냈어요 · ' + r.savedAt;
      INQ.loaded = false;
      inqLoad(false, function(){ inqTab('list'); });
    } else {
      err.textContent = (r && r.reason) || '보내지 못했어요. 잠시 후 다시 시도해 주세요.';
      err.classList.add('on');
    }
  }).withFailureHandler(function(){
    b.disabled = false; b.textContent = '문의 보내기';
    err.textContent = '보내지 못했어요. 잠시 후 다시 시도해 주세요.';
    err.classList.add('on');
  }).submitInquiry({
    role: INQ.role, no: w.no, name: w.name, type: INQ.type,
    day: document.getElementById('iq-day').value, message: msg,
    photos: INQ.shots.map(function(s){ return { base64: s.base64, mime: s.mime }; })
  });
}

function inqLoad(quiet, done){
  var w = inqWho(); if (!w.no && !w.name) return;
  if (!quiet) {
    var el = document.getElementById('iq-list');
    if (el && INQ.tab === 'list') el.innerHTML = '<div class="iq-empty">불러오는 중…</div>';
  }
  google.script.run.withSuccessHandler(function(r){
    INQ.loaded = true;
    INQ.list = (r && r.ok) ? r.list : [];
    inqBadge();
    if (INQ.tab === 'list') inqRenderList();
    if (done) done();
  }).withFailureHandler(function(){ INQ.loaded = true; if (done) done(); }).getMyInquiries(w.no, w.name);
}

/* 답변이 달렸는데 아직 안 본 문의가 있으면 빨간 점 */
function inqSeenKey(){ var w = inqWho(); return 'inq_seen_' + (w.no || w.name); }
function inqBadge(){
  var list = INQ.list || [];
  var seen = 0; try { seen = parseInt(localStorage.getItem(inqSeenKey()) || '0', 10) || 0; } catch(e){}
  var replied = list.filter(function(x){ return x.reply; }).length;
  var on = replied > seen;
  var d1 = document.getElementById('iq-dot'), d2 = document.getElementById('iq-fab-dot');
  if (d1) d1.style.display = on ? 'inline-block' : 'none';
  if (d2) d2.style.display = on ? 'block' : 'none';
}
function inqMarkSeen(){
  var replied = (INQ.list || []).filter(function(x){ return x.reply; }).length;
  try { localStorage.setItem(inqSeenKey(), String(replied)); } catch(e){}
  inqBadge();
}

function inqRenderList(){
  var el = document.getElementById('iq-list'); if (!el) return;
  var list = INQ.list;
  if (!list) { el.innerHTML = '<div class="iq-empty">불러오는 중…</div>'; return; }
  if (!list.length) { el.innerHTML = '<div class="iq-empty">아직 보낸 문의가 없어요.</div>'; inqMarkSeen(); return; }
  el.innerHTML = list.map(function(x){
    var sc = x.status === '완료' ? 's2' : (x.status === '처리중' ? 's1' : 's0');
    return '<div class="iq-item">'
      + '<div class="iq-it-h"><span class="iq-tag">' + inqEsc(x.type) + '</span>'
      + (x.day ? '<span class="iq-tag">' + x.day + '일차</span>' : '')
      + '<span class="iq-st ' + sc + '">' + inqEsc(x.status) + '</span>'
      + '<span class="iq-when">' + inqEsc(x.at) + '</span></div>'
      + '<div class="iq-msg">' + inqEsc(x.message) + '</div>'
      + (x.hasPhoto ? '<button type="button" class="iq-ph" onclick="inqPhoto(' + x.row + ',0)">📷 첨부한 사진 보기' + (x.photoCount > 1 ? ' (' + x.photoCount + '장)' : '') + '</button>' : '')
      + (x.reply ? '<div class="iq-rep"><div class="h">👩‍🏫 선생님 답변 · ' + inqEsc(x.repliedAt) + '</div><div class="b">' + inqEsc(x.reply) + '</div></div>' : '')
      + '</div>';
  }).join('');
  inqMarkSeen();
}
function inqEsc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function inqPhoto(row, idx){
  var o = document.createElement('div');
  o.className = 'iq-lbox';
  o.innerHTML = '<button type="button" class="x">✕</button><div class="ld">사진 불러오는 중…</div>';
  o.querySelector('.x').onclick = function(){ o.remove(); };
  o.onclick = function(e){ if (e.target === o) o.remove(); };
  document.body.appendChild(o);
  var w = inqWho();
  google.script.run.withSuccessHandler(function(r){
    if (!o.isConnected) return;
    var nav = '';
    if (r && r.ok && r.count > 1) {
      nav = '<div style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:13px;">'
          + '<button type="button" class="pv" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:7px 12px;margin:0 6px;font-weight:800;cursor:pointer;">‹ 이전</button>'
          + (r.index + 1) + ' / ' + r.count
          + '<button type="button" class="nx" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:7px 12px;margin:0 6px;font-weight:800;cursor:pointer;">다음 ›</button></div>';
    }
    o.innerHTML = '<button type="button" class="x">✕</button>' + ((r && r.ok)
      ? '<img src="' + r.dataUrl + '" alt="문의 첨부 사진">'
      : '<div class="ld">' + ((r && r.reason) || '사진을 불러오지 못했어요.') + '</div>') + nav;
    o.querySelector('.x').onclick = function(){ o.remove(); };
    var pv = o.querySelector('.pv'), nx = o.querySelector('.nx');
    if (pv) pv.onclick = function(){ o.remove(); inqPhoto(row, (r.index - 1 + r.count) % r.count); };
    if (nx) nx.onclick = function(){ o.remove(); inqPhoto(row, (r.index + 1) % r.count); };
  }).withFailureHandler(function(){
    if (!o.isConnected) return;
    o.innerHTML = '<button type="button" class="x">✕</button><div class="ld">사진을 불러오지 못했어요.</div>';
    o.querySelector('.x').onclick = function(){ o.remove(); };
  }).getInquiryPhoto(w.no, row, true, idx || 0);
}

/* 화면 전환 때마다 문의 버튼 노출 갱신 */
(function(){
  ['go', 'showScreen', 'tab'].forEach(function(fn){
    var orig = window[fn];
    if (typeof orig !== 'function') return;
    window[fn] = function(){ var r = orig.apply(this, arguments); try { inqFab(); } catch(e){} return r; };
  });
  document.addEventListener('DOMContentLoaded', function(){ inqRenderTypes(); setTimeout(inqFab, 400); });
  setTimeout(function(){ try { inqRenderTypes(); inqFab(); } catch(e){} }, 800);
})();

</script>
<script>
/* ═══ UI-DIALOG v1 [v2.49] — 브라우저 기본 대화상자 대체 ═══
   GAS/PWA 어디서든 «...googleusercontent.com에 삽입된 페이지 내용:» 제목 없이
   앱 디자인 그대로 알림·확인·입력을 띄운다. */
(function(){
  if (window.uiAlert) return;

  var css = ''
    + '.ud-ov{position:fixed;inset:0;background:rgba(24,18,15,.52);z-index:100000;display:flex;align-items:center;justify-content:center;padding:22px;'
    +   '-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:udFade .13s ease-out;}'
    + '@keyframes udFade{from{opacity:0}to{opacity:1}}'
    + '@keyframes udPop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}'
    + '.ud-bx{width:100%;max-width:330px;background:#fff;border-radius:16px;padding:22px 20px 16px;'
    +   'box-shadow:0 18px 48px rgba(0,0,0,.28);animation:udPop .16s ease-out;'
    +   'font-family:inherit;text-align:center;}'
    + '.ud-ic{font-size:30px;line-height:1;margin-bottom:10px;}'
    + '.ud-ti{font-size:16px;font-weight:800;color:#241C18;margin-bottom:7px;}'
    + '.ud-ms{font-size:14px;line-height:1.6;color:#4A3B34;white-space:pre-line;word-break:break-word;max-height:46vh;overflow-y:auto;text-align:left;}'
    + '.ud-bx.c .ud-ms{text-align:center;}'
    + '.ud-in{width:100%;box-sizing:border-box;margin-top:13px;border:1.5px solid #E3D8D0;border-radius:10px;'
    +   'padding:11px 13px;font-size:14.5px;font-family:inherit;color:#241C18;background:#FFFDFC;}'
    + '.ud-in:focus{outline:none;border-color:var(--ud-c);}'
    + '.ud-bt{display:flex;gap:8px;margin-top:17px;}'
    + '.ud-bt button{flex:1;border:none;border-radius:11px;padding:12px 0;font-size:14.5px;font-weight:800;'
    +   'font-family:inherit;cursor:pointer;}'
    + '.ud-ok{background:var(--ud-c);color:#fff;}'
    + '.ud-no{background:#F2ECE8;color:#6B5A52;}'
    + '.ud-dg{background:#D93025;color:#fff;}';
  var st = document.createElement('style');
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  /* 앱 대표색을 그대로 쓴다(관리자=파랑, 챌린저=코랄 …) */
  function accent(){
    try {
      var s = getComputedStyle(document.documentElement);
      var v = (s.getPropertyValue('--primary') || s.getPropertyValue('--coral') || '').trim();
      if (v) return v;
    } catch(e){}
    return '#FF6A4A';
  }

  function open(o){
    var ov = document.createElement('div');
    ov.className = 'ud-ov';
    ov.style.setProperty('--ud-c', accent());
    var wantInput = (o.mode === 'prompt');
    ov.innerHTML = '<div class="ud-bx' + (o.center === false ? '' : ' c') + '">'
      + (o.icon ? '<div class="ud-ic">' + o.icon + '</div>' : '')
      + (o.title ? '<div class="ud-ti">' + esc(o.title) + '</div>' : '')
      + '<div class="ud-ms">' + esc(o.message) + '</div>'
      + (wantInput ? '<input class="ud-in" type="text" placeholder="' + esc(o.placeholder || '') + '" value="' + esc(o.value || '') + '">' : '')
      + '<div class="ud-bt">'
      +   (o.mode === 'alert' ? '' : '<button type="button" class="ud-no">' + esc(o.cancelText || '취소') + '</button>')
      +   '<button type="button" class="ud-' + (o.danger ? 'dg' : 'ok') + '">' + esc(o.okText || '확인') + '</button>'
      + '</div></div>';
    document.body.appendChild(ov);

    var input = ov.querySelector('.ud-in');
    var done = false;
    function close(){ if (done) return; done = true; document.removeEventListener('keydown', key, true); ov.remove(); }
    function ok(){ var v = input ? input.value : true; close(); if (o.onOk) o.onOk(v); }
    function no(){ close(); if (o.onCancel) o.onCancel(); }
    function key(e){
      if (e.key === 'Escape') { e.preventDefault(); if (o.mode === 'alert') ok(); else no(); }
      else if (e.key === 'Enter' && (!input || document.activeElement === input)) { e.preventDefault(); ok(); }
    }
    ov.querySelector('.ud-ok, .ud-dg').onclick = ok;
    var nb = ov.querySelector('.ud-no'); if (nb) nb.onclick = no;
    ov.onclick = function(e){ if (e.target === ov && o.mode !== 'prompt') { if (o.mode === 'alert') ok(); else no(); } };
    document.addEventListener('keydown', key, true);
    setTimeout(function(){ (input || ov.querySelector('.ud-ok, .ud-dg')).focus(); }, 30);
    return ov;
  }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* 메시지 앞머리 이모지를 아이콘으로 끌어올린다 (✅ 저장됐어요 → 아이콘 ✅) */
  function split(msg){
    var m = String(msg == null ? '' : msg);
    var f = m.match(/^\s*([\u2190-\u2BFF\u{1F300}-\u{1FAFF}\u2705\u26A0\uFE0F]+)\s+/u);
    if (f) return { icon: f[1], message: m.slice(f[0].length) };
    return { icon: '', message: m };
  }

  window.uiAlert = function(msg, onOk){
    var s = split(msg);
    return open({ mode:'alert', icon: s.icon || 'ℹ️', message: s.message, onOk: onOk });
  };
  window.uiConfirm = function(msg, onOk, opt){
    opt = opt || {};
    var s = split(msg);
    return open({ mode:'confirm', icon: s.icon || (opt.danger ? '🗑' : '❓'), message: s.message,
      okText: opt.okText, cancelText: opt.cancelText, danger: opt.danger, onOk: onOk, onCancel: opt.onCancel });
  };
  window.uiPrompt = function(msg, onOk, opt){
    opt = opt || {};
    var s = split(msg);
    return open({ mode:'prompt', icon: s.icon || '✏️', message: s.message, center:false,
      placeholder: opt.placeholder, value: opt.value, okText: opt.okText, onOk: onOk, onCancel: opt.onCancel });
  };

  /* 기본 alert 는 그대로 바꿔치기 (반환값을 안 쓰므로 안전) */
  window.alert = function(m){ window.uiAlert(m); };
})();
</script>
